<script>
(function () {
  var posts = (window.MK_POSTS || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var lista = document.getElementById('lista-posts');
  if (!lista || !posts.length) return;
  lista.textContent = '';
  function el(tag, clase, texto) {
    var n = document.createElement(tag);
    if (clase) n.className = clase;
    if (texto) n.textContent = texto;
    return n;
  }
  function fecha(iso) {
    try { return new Date(iso + 'T00:00:00Z').toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); }
    catch (e) { return iso; }
  }
  posts.forEach(function (p) {
    var a = el('a', 'post-card');
    a.href = '/blog/' + p.slug + '/';
    a.appendChild(el('span', 'eyebrow', p.category || 'Blog'));
    a.appendChild(el('h2', '', p.title));
    a.appendChild(el('p', '', p.description));
    var pie = el('span', 'foot');
    pie.appendChild(el('span', 'meta', fecha(p.date)));
    var mas = el('span', 'more', 'Leer ');
    mas.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>');
    pie.appendChild(mas);
    a.appendChild(pie);
    lista.appendChild(a);
  });
})();
</script>
